pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,js,json,md}"
      run: bunx --no-install biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.ts"
      run: bunx --no-install tsc --noEmit

pre-push:
  commands:
    lockfile:
      run: bun scripts/hooks.ts bun install --frozen-lockfile
    local:
      run: bun scripts/hooks.ts bun run check:local

commit-msg:
  commands:
    commitlint:
      run: bunx --no-install commitlint --edit "{1}"
