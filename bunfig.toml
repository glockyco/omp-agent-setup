[install]
exact = false
# Renovate's config:best-practices holds npm releases for 3 days but cannot do so for lock file
# maintenance, so Bun applies the same minimum age whenever it resolves versions.
minimumReleaseAge = 259200

[test]
coverage = true
coverageReporter = ["text"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["types/**"]
coverageThreshold = 0.8
