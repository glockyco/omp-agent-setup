name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.classify.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test complete-diff classification
        run: python3 -m unittest discover -s tests -p test_ci_paths.py
      - name: Classify the complete PR diff
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/classify_ci_paths.py

  openspec:
    uses: ./.github/workflows/openspec.yml
  nix-openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1
      - name: Check Nix OpenSpec version, adapters, and contracts
        run: >-
          nix build --no-link --print-build-logs
          .#checks.x86_64-linux.openspec-version
          .#checks.x86_64-linux.openspec-adapters
          .#checks.x86_64-linux.openspec-contracts
  linux:
    name: check (ubuntu-latest)
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.native != 'false')
    runs-on: ubuntu-latest
    # Static jobs retain each required context when documentation skips native CI.
    steps: &native-steps
      - name: Require successful native classification
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NATIVE_REQUIRED: ${{ needs.changes.outputs.native }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$NATIVE_REQUIRED" = true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release-version check compares the payload with the base revision.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun run check:toolchain
      - run: bun install --frozen-lockfile
      - run: python -m venv .venv
      - name: Install development Python wheels (Unix)
        if: runner.os != 'Windows'
        run: '.venv/bin/python -m pip install --only-binary=:all: -r requirements-dev.txt'
      - name: Install development Python wheels (Windows)
        if: runner.os == 'Windows'
        run: '& .\.venv\Scripts\python.exe -m pip install --only-binary=:all: -r requirements-dev.txt'
      - run: bun x --no-install lefthook install
      - run: bun run setup:release-omp
        id: omp_setup
      - run: bun run ci
        env:
          RELEASE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          CI: '1'
          OPENSPEC_TELEMETRY: '0'
      - name: Remove isolated official binary
        if: always() && steps.omp_setup.outcome == 'success'
        run: bun run setup:release-omp --cleanup

  macos:
    name: check (macos-15)
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.native != 'false')
    runs-on: macos-15
    steps: *native-steps

  windows:
    name: check (windows-latest)
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.native != 'false')
    runs-on: windows-latest
    steps: *native-steps
