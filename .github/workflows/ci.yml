name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openspec:
    uses: ./.github/workflows/openspec.yml
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release-version check compares the payload with the base revision.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun run check:toolchain
      - run: bun install --frozen-lockfile
      - run: python -m venv .venv
      - name: Install development Python wheels (Unix)
        if: runner.os != 'Windows'
        run: '.venv/bin/python -m pip install --only-binary=:all: -r requirements-dev.txt'
      - name: Install development Python wheels (Windows)
        if: runner.os == 'Windows'
        run: '.venv/Scripts/python.exe -m pip install --only-binary=:all: -r requirements-dev.txt'
      - run: bunx --no-install lefthook install
      - run: bun run setup:release-omp
        id: omp_setup
      - run: bun run ci
        env:
          RELEASE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          CI: '1'
          OPENSPEC_TELEMETRY: '0'
      - name: Remove isolated official binary
        if: always() && steps.omp_setup.outcome == 'success'
        run: bun run setup:release-omp --cleanup
