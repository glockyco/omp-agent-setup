name: Update flake inputs

on:
  schedule:
    # Saturdays at 04:00 UTC.
    # Runbook: https://github.com/glockyco/nix-config/blob/main/docs/operations/dependency-updates.md
    - cron: "0 4 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/determinate-nix-action@v3.21.9

      - name: Create dependency updater token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPENDENCY_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: DeterminateSystems/update-flake-lock@v28
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update-flake-lock
          commit-msg: "chore(deps): update flake inputs"
          pr-title: "chore(deps): update flake inputs"
          pr-body: |
            Automated complete `flake.lock` update.

            This pull request is review-only. Both required platform checks must pass before merge.
